x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: minipay-airflow:2.10.5
  environment:
    OLTP_HOST: postgres-oltp
    OLTP_PORT: "5432"
    DWH_HOST: postgres-dwh
    DWH_PORT: "5432"
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    DWH_POSTGRES_PASSWORD: ${DWH_POSTGRES_PASSWORD}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
  depends_on:
    - postgres-airflow

services:
  postgres-oltp:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: minipay_oltp
    ports:
      - "5432:5432"
    volumes:
      - postgres-oltp-data:/var/lib/postgresql/data

  postgres-dwh:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: ${DWH_POSTGRES_PASSWORD}
      POSTGRES_DB: minipay_dwh
    ports:
      - "5433:5432"
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data

  postgres-airflow:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db init && airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@example.com --password admin

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler
    depends_on:
      postgres-airflow:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    profiles: ["ui"]
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-oltp-data:
  postgres-dwh-data:
  postgres-airflow-data:
