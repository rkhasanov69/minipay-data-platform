seeds:
  - name: uz_holidays
    description: "Праздники и переносы Узбекистана (пятидневная неделя). Ведётся вручную по указам Президента; 2027 год добавить, когда выйдет указ."
    config:
      schema: staging
      column_types:
        date_day: date
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: day_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['holiday', 'day_off', 'workday']
