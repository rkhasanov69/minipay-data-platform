models:
  - name: mart_merchant_turnover
    description: "Оборот по мерчантам за всё время. Только успешные оплаты (operation_type = payment, status = success). Одна строка на мерчанта; мерчанты без успешных оплат в витрину не попадают."
    columns:
      - name: merchant_id
        description: "ID мерчанта"
        data_tests:
          - unique
          - not_null
      - name: merchant_name
        description: "Название мерчанта для клиентов (displayed_name)"
      - name: merchant_city
        description: "Город регистрации юрлица мерчанта, не город точки продаж"
      - name: payments_count
        description: "Количество успешных оплат"
      - name: turnover
        description: "Сумма успешных оплат, сум"
      - name: avg_cheque
        description: "Средний чек успешной оплаты, сум, округлён до 2 знаков"

  - name: dim_merchants
    description: "Измерение мерчантов. Одна строка = один мерчант, включая приостановленных (suspended): у них есть исторические транзакции."
    columns:
      - name: merchant_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'suspended']

  - name: dim_cards
    description: "Измерение карт. Одна строка = одна карта вместе с атрибутами владельца (город, статус, дата регистрации). ФИО и телефон пользователя не включены — персональные данные."
    columns:
      - name: card_id
        data_tests:
          - unique
          - not_null
      - name: card_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'blocked']
      - name: card_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['visa', 'mastercard', 'humo', 'uzcard']
      - name: user_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'restricted', 'blocked', 'deceased']
  - name: dim_date
    description: "Календарь. Одна строка = один день. Диапазон фиксированный: 2026-01-01 — 2027-12-31; до конца 2027 года его нужно продлить в dim_date.sql (иначе упадёт тест relationships у факта). Праздники (is_holiday) будут добавлены через seed."
    columns:
      - name: date_day
        description: "Дата (ключ). Факт соединяется по transaction_date = date_day"
        data_tests:
          - unique
          - not_null
      - name: day_of_week
        description: "День недели по ISO: 1 = понедельник ... 7 = воскресенье"
      - name: is_weekend
        description: "true для субботы и воскресенья"
      - name: is_holiday
        description: "Официальный праздник (из seed uz_holidays)"
      - name: is_day_off
        description: "Нерабочий день для пятидневки: выходные + праздники + переносы, минус рабочие субботы"
