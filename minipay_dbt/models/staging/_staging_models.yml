models:
  - name: stg_users
    description: "Пользователи MiniPay. Копия raw.users, id переименован в user_id"
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'blocked', 'restricted', 'deceased']

  - name: stg_cards
    description: "Карты пользователей. Копия raw.cards, id переименован в card_id. Номер карты не хранится, только last4"
    columns:
      - name: card_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: card_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['visa', 'mastercard', 'humo', 'uzcard']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'blocked']

  - name: stg_merchants
    description: "Мерчанты (юрлица). Копия raw.merchants, id переименован в merchant_id"
    columns:
      - name: merchant_id
        data_tests:
          - unique
          - not_null
      - name: inn
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'suspended']

  - name: stg_transactions
    description: "Транзакции: переводы карта-карта и оплаты мерчантам. Копия raw.transactions, id переименован в transaction_id. У перевода заполнен receiver_card_id, у оплаты merchant_id"
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: sender_card_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cards')
                field: card_id
      - name: receiver_card_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_cards')
                field: card_id
      - name: merchant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id
      - name: operation_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['transfer', 'payment']
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['in_app', 'qr', 'terminal']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'success', 'failure']

  - name: stg_transaction_status_history
    description: "Журнал смен статуса транзакций, только добавление строк. Каждая транзакция начинается с pending. Копия raw.transaction_status_history, id переименован в status_history_id"
    columns:
      - name: status_history_id
        data_tests:
          - unique
          - not_null
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_transactions')
                field: transaction_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'success', 'failure']
